<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c2410c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="스페인 여행">
  <title>스페인 신혼여행</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1 id="tripTitle">스페인 신혼여행</h1>
      <p id="tripSub" class="sub"></p>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="설정">⚙</button>
  </header>

  <main id="view"></main>

  <nav class="tabbar" aria-label="메뉴">
    <button data-tab="days" class="active"><span class="ti">📅</span>일정</button>
    <button data-tab="check"><span class="ti">✅</span>체크리스트</button>
    <button data-tab="budget"><span class="ti">💶</span>예산</button>
    <button data-tab="book"><span class="ti">🎫</span>예약</button>
  </nav>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button type="button" class="btn danger" id="modalDelete">삭제</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="modalCancel">취소</button>
        <button type="submit" class="btn primary" id="modalSave">저장</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
