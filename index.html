<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF7A00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MasterTrip">
  <meta name="application-name" content="MasterTrip">
  <title>MasterTrip Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 홈·내 여행: 노을 배경 상단 -->
  <header class="hero" id="hero">
    <button class="hero-btn" id="searchBtn" aria-label="여행 검색">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <p class="logo"><span class="logo-m">M</span>asterTrip Planner</p>
  </header>

  <!-- 내 여행 안의 상단 탭 -->
  <nav class="top-tabs" id="topTabs" aria-label="내 여행 메뉴">
    <button data-sub="trips" class="active">내 여행</button>
    <button data-sub="check">체크리스트</button>
    <button data-sub="budget">예산</button>
    <button data-sub="book">예약</button>
  </nav>

  <!-- 여행 상세·기록·설정: 간단한 상단 -->
  <header class="topbar" id="topbar" hidden>
    <button class="icon-btn back-btn" id="backBtn" aria-label="내 여행 목록으로" hidden>‹</button>
    <div class="top-main">
      <p class="brand" title="MasterTrip Planner">MasterTrip</p>
      <h1 id="tripTitle"></h1>
      <p id="tripSub" class="sub"></p>
    </div>
    <button class="icon-btn" id="tripEditBtn" aria-label="여행 정보 수정" hidden>✎</button>
  </header>

  <main id="view"></main>

  <nav class="tabbar" aria-label="메뉴">
    <button data-main="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button data-main="trips" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>내 여행</button>
    <button data-main="records"><svg viewBox="0 0 24 24"><path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>기록</button>
    <button data-main="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
  </nav>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button type="button" class="btn danger" id="modalDelete">삭제</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="modalCancel">취소</button>
        <button type="submit" class="btn primary" id="modalSave">저장</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
